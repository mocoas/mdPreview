<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdPreview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

    <main class="app-shell" data-testid="app-shell">
      <header class="app-header">
        <p class="eyebrow">Markdown Preview</p>
        <h1>貼り付けて、切り替えて確認</h1>
      </header>

      <nav class="tabs" role="tablist" aria-label="入力とプレビュー" data-testid="preview-tablist">
        <button
          id="tab-input"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-input"
          data-tab="input"
          data-testid="tab-input"
          class="tab-button is-active"
        >
          入力
        </button>
        <button
          id="tab-preview"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-preview"
          data-tab="preview"
          data-testid="tab-preview"
          class="tab-button"
        >
          プレビュー
        </button>
      </nav>

      <section
        id="panel-input"
        role="tabpanel"
        aria-labelledby="tab-input"
        class="panel"
        data-testid="panel-input"
      >
        <label for="markdown-input" class="input-label">Markdown テキスト</label>
        <textarea
          id="markdown-input"
          class="markdown-input"
          data-testid="markdown-input"
          spellcheck="false"
          placeholder="# 見出し\n\nここに Markdown を貼り付け"
        ></textarea>
        <p id="input-help" class="input-help">上限 200KB。プレビュータブ移動時に変換します。</p>
      </section>

      <section
        id="panel-preview"
        role="tabpanel"
        aria-labelledby="tab-preview"
        class="panel is-hidden"
        data-testid="panel-preview"
      >
        <p id="status-message" class="status-message" data-testid="status-message" aria-live="polite"></p>
        <article id="preview-output" class="preview-output" data-testid="preview-output"></article>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
