<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdPreview</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        box-sizing: border-box;
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        min-height: 100vh;
        padding: 1rem;
      }

      section {
        border: 1px solid #8884;
        border-radius: 0.5rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      h1,
      h2 {
        font-size: 1rem;
        margin: 0;
        padding: 0.75rem 1rem;
      }

      .controls {
        border-bottom: 1px solid #8884;
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      textarea {
        border: 0;
        flex: 1;
        font: 14px/1.5 "SFMono-Regular", Consolas, monospace;
        min-height: 55vh;
        padding: 1rem;
        resize: vertical;
      }

      .preview {
        flex: 1;
        line-height: 1.6;
        min-height: 55vh;
        overflow: auto;
        padding: 1rem;
        word-break: break-word;
      }

      .preview pre {
        overflow: auto;
        padding: 0.75rem;
      }

      .hint {
        font-size: 0.875rem;
        margin: 0 1rem 0.75rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="controls">
          <h1>Markdown 入力</h1>
          <input id="fileInput" type="file" accept=".md,.markdown,text/markdown" />
        </div>
        <p class="hint">.mdファイルを貼り付けるか、テキストを貼り付けてください。</p>
        <textarea id="markdownInput" placeholder="ここにMarkdownを貼り付け"></textarea>
      </section>

      <section>
        <h2>プレビュー</h2>
        <div id="preview" class="preview" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const input = document.getElementById("markdownInput");
      const fileInput = document.getElementById("fileInput");
      const preview = document.getElementById("preview");

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function markdownToHtml(markdown) {
        const safeMarkdown = escapeHtml(markdown).replace(/\r\n?/g, "\n");
        const codeBlocks = [];

        let html = safeMarkdown.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, language, code) => {
          const index = codeBlocks.push(
            `<pre><code class="language-${language}">${code.trimEnd()}</code></pre>`
          );
          return `@@CODE_BLOCK_${index - 1}@@`;
        });

        html = html
          .replace(/^###### (.*)$/gm, "<h6>$1</h6>")
          .replace(/^##### (.*)$/gm, "<h5>$1</h5>")
          .replace(/^#### (.*)$/gm, "<h4>$1</h4>")
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, text, href) => {
            try {
              const parsed = new URL(href);
              if (!["http:", "https:"].includes(parsed.protocol)) {
                return text;
              }
              return `<a href="${escapeHtml(parsed.toString())}" target="_blank" rel="noopener noreferrer">${text}</a>`;
            } catch {
              return text;
            }
          })
          .replace(/^> (.*)$/gm, "<blockquote>$1</blockquote>");

        html = html.replace(/(?:^|\n)((?:[-*+] .*(?:\n|$))+)/g, (_, listBlock) => {
          const listItems = listBlock
            .trim()
            .split("\n")
            .map((line) => `<li>${line.replace(/^[-*+] /, "")}</li>`)
            .join("");
          return `\n<ul>${listItems}</ul>\n`;
        });

        html = html
          .split(/\n{2,}/)
          .map((chunk) => {
            const trimmed = chunk.trim();
            if (!trimmed) {
              return "";
            }

            if (/^<(h[1-6]|ul|ol|li|pre|blockquote)/.test(trimmed)) {
              return trimmed;
            }

            return `<p>${trimmed.replace(/\n/g, "<br>")}</p>`;
          })
          .join("\n");

        return html.replace(/@@CODE_BLOCK_(\d+)@@/g, (_, index) => codeBlocks[Number(index)] || "");
      }

      function render() {
        preview.innerHTML = markdownToHtml(input.value);
      }

      async function loadFile(file) {
        if (!file) {
          return;
        }
        const text = await file.text();
        input.value = text;
        render();
      }

      function getMarkdownClipboardFile(event) {
        const item = [...(event.clipboardData?.items || [])].find((entry) => entry.kind === "file");
        const file = item?.getAsFile();

        if (!file) {
          return null;
        }

        const isMarkdownFile =
          /\.md$|\.markdown$/i.test(file.name || "") ||
          file.type === "text/markdown" ||
          file.type === "text/x-markdown";

        return isMarkdownFile ? file : null;
      }

      input.addEventListener("input", render);

      fileInput.addEventListener("change", (event) => {
        loadFile(event.target.files[0]);
      });

      async function handlePaste(event) {
        const file = getMarkdownClipboardFile(event);
        if (!file) {
          return;
        }
        event.preventDefault();
        await loadFile(file);
      }

      input.addEventListener("paste", handlePaste);
      window.addEventListener("paste", handlePaste);

      render();
    </script>
  </body>
</html>
